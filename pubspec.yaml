name: magic_social_auth
description: "Social sign-in for Magic apps: native Google and Apple sheets, a PKCE browser flow for GitHub and Microsoft, and your backend decides the outcome."
version: 1.0.1
homepage: https://anilcancakir.com/magic_social_auth
repository: https://github.com/anilcancakir/magic_social_auth
issue_tracker: https://github.com/anilcancakir/magic_social_auth/issues

topics:
  - authentication
  - social-auth
  - oauth
  - magic-framework
  - socialite

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^1.0.0
  google_sign_in: ^7.2.0
  flutter_web_auth_2: ^5.1.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  dowel: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  material_ui: ^1.11.0
